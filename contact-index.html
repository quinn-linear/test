<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - RideShare</title>
    <link rel="stylesheet" href="contact-styles.css">
</head>
<body>
    <div class="container">
        <h1>Get in Touch</h1>
        <p>We'd love to hear from you! Click the button below to contact our support team.</p>
        
        <!-- Contact Us button in royal purple -->
        <button class="contact-us-btn" onclick="handleContactClick()">
            Contact Us
        </button>
        
        <div class="contact-info">
            <h2>Other Ways to Reach Us</h2>
            <p>📧 Email: support@rideshare.com</p>
            <p>📞 Phone: 1-800-RIDESHARE</p>
            <p>🕒 Hours: 24/7 Customer Support</p>
        </div>
    </div>

    <script>
        function handleContactClick() {
            alert('Thank you for your interest! Our contact form will open shortly.');
            // In a real application, this would redirect to a contact form or open a modal
        }
    </script>
</body>
</html>
